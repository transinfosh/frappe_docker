name: Mirror release image

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full source registry image name without a tag"
        required: true
        type: string
      image_tag:
        description: "Exact source image tag; takes precedence over release_tag"
        required: false
        default: ""
        type: string
      release_tag:
        description: "Published version, optionally prefixed with v"
        required: false
        default: ""
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
    outputs:
      image:
        value: ${{ jobs.mirror.outputs.image }}
      digest:
        value: ${{ jobs.mirror.outputs.digest }}
  workflow_dispatch:
    inputs:
      image_name:
        description: "Full source registry image name without a tag"
        required: true
        default: docker.io/library/hello-world
        type: string
      image_tag:
        description: "Exact source image tag; takes precedence over release_tag"
        required: false
        default: ""
        type: string
      release_tag:
        description: "Published version, optionally prefixed with v"
        required: false
        default: linux
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: mirror-${{ github.repository }}-${{ inputs.image_name }}-${{ inputs.image_tag || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.copy.outputs.image }}
      digest: ${{ steps.copy.outputs.digest }}
    steps:
      - name: Prepare image references
        id: references
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          image_name="${INPUT_IMAGE_NAME,,}"
          version="$IMAGE_TAG"
          if [ -z "$version" ]; then
            version="$RELEASE_TAG"
            if [[ "$version" =~ ^v[0-9] ]]; then
              version="${version#v}"
            fi
          fi
          [[ "$image_name" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9_./-]+$ ]]
          [[ "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          {
            echo "source=$image_name:$version"
            echo "source_name=$image_name"
            echo "destination=registry.trinfo.net/${image_name#*/}:$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install verified crane
        run: |
          crane_dir="$(mktemp -d "$RUNNER_TEMP/crane.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$crane_dir/crane.tar.gz" \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          printf '%s  %s\n' \
            0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0 \
            "$crane_dir/crane.tar.gz" | sha256sum --check --status
          tar -xzf "$crane_dir/crane.tar.gz" -C "$crane_dir" crane
          echo "$crane_dir" >> "$GITHUB_PATH"

      - name: Login to GHCR
        if: startsWith(inputs.image_name, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to private Registry
        uses: docker/login-action@v4
        with:
          registry: registry.trinfo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Copy and verify all image platforms
        id: copy
        env:
          SOURCE: ${{ steps.references.outputs.source }}
          SOURCE_NAME: ${{ steps.references.outputs.source_name }}
          DESTINATION: ${{ steps.references.outputs.destination }}
        run: |
          digest="$(crane digest "$SOURCE")"
          for attempt in 1 2 3; do
            if crane copy --jobs=2 "$SOURCE_NAME@$digest" "$DESTINATION"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          test "$(crane digest "$DESTINATION")" = "$digest"
          {
            echo "image=$DESTINATION"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          printf 'Published %s@%s\n' "$DESTINATION" "$digest" >> "$GITHUB_STEP_SUMMARY"
